{% extends 'base.html' %}

{% block title %}编辑资料 - 刘氏乾正公族谱{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-pencil me-2"></i>编辑资料</h4>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        {{ error }}
                    </div>
                    {% else %}
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-4">
                            <h5>基本信息</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">姓名</label>
                                    <input type="text" class="form-control" id="name" name="name" value="{{ related_person.name }}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="courtesy_name" class="form-label">字</label>
                                    <input type="text" class="form-control" id="courtesy_name" name="courtesy_name" value="{{ related_person.courtesy_name }}">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="art_name" class="form-label">号</label>
                                    <input type="text" class="form-control" id="art_name" name="art_name" value="{{ related_person.art_name }}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="alias" class="form-label">别名</label>
                                    <input type="text" class="form-control" id="alias" name="alias" value="{{ related_person.alias }}">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="generation_char" class="form-label">辈份字</label>
                                <input type="text" class="form-control" id="generation_char" name="generation_char" value="{{ related_person.generation_char }}">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <h5>生卒信息</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="birth_year" class="form-label">出生年份</label>
                                    <input type="number" class="form-control" id="birth_year" name="birth_year" value="{{ related_person.birth_year }}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="death_year" class="form-label">逝世年份</label>
                                    <input type="number" class="form-control" id="death_year" name="death_year" value="{{ related_person.death_year }}">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="birth_place" class="form-label">出生地</label>
                                <input type="text" class="form-control" id="birth_place" name="birth_place" value="{{ related_person.birth_place }}">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <h5>墓葬信息</h5>
                            <div class="mb-3">
                                <label for="burial_place" class="form-label">葬地</label>
                                <input type="text" class="form-control" id="burial_place" name="burial_place" value="{{ related_person.burial_place }}">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="burial_fengshui" class="form-label">墓形/风水</label>
                                    <input type="text" class="form-control" id="burial_fengshui" name="burial_fengshui" value="{{ related_person.burial_fengshui }}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="burial_direction" class="form-label">坐向</label>
                                    <input type="text" class="form-control" id="burial_direction" name="burial_direction" value="{{ related_person.burial_direction }}">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <h5>生平简介</h5>
                            <div class="mb-3">
                                <label for="biography" class="form-label">生平简介</label>
                                <textarea class="form-control" id="biography" name="biography" rows="3">{{ related_person.biography }}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="achievements" class="form-label">主要事迹</label>
                                <textarea class="form-control" id="achievements" name="achievements" rows="3">{{ related_person.achievements }}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="descendants_location" class="form-label">后裔分布</label>
                                <textarea class="form-control" id="descendants_location" name="descendants_location" rows="3">{{ related_person.descendants_location }}</textarea>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <h5>头像</h5>
                            <div class="mb-3">
                                {% if related_person.avatar %}
                                <div class="mb-2">
                                    <img src="{{ related_person.avatar.url }}" class="img-fluid rounded" style="max-height: 200px;" alt="{{ related_person.name }}">
                                </div>
                                {% endif %}
                                <label for="avatar" class="form-label">上传头像</label>
                                <input type="file" class="form-control" id="avatar" name="avatar">
                                <small class="text-muted">支持 JPG, JPEG, PNG 格式，文件大小不超过 2MB</small>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-2"></i>保存修改
                            </button>
                            <a href="{% url 'genealogy:profile' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-2"></i>返回个人资料
                            </a>
                        </div>
                    </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
