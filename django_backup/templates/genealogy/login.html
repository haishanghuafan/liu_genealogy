{% extends 'base.html' %}

{% block title %}登录 - 刘氏乾正公族谱{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle" style="font-size: 4rem; color: var(--primary-color);"></i>
                        <h3 class="serif mt-3">用户登录</h3>
                        <p class="text-muted">欢迎回到刘氏乾正公族谱</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {% for error in form.non_field_errors %}
                            {{ error }}
                            {% endfor %}
                        </div>
                        {% endif %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">用户名</label>
                            <input type="text" name="username" id="id_username" 
                                   class="form-control form-control-lg" 
                                   placeholder="请输入用户名" required autofocus>
                        </div>
                        
                        <div class="mb-4">
                            <label for="id_password" class="form-label">密码</label>
                            <input type="password" name="password" id="id_password" 
                                   class="form-control form-control-lg" 
                                   placeholder="请输入密码" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>登录
                            </button>
                        </div>
                    </form>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <p class="mb-2">还没有账号？</p>
                        <a href="{% url 'genealogy:register' %}" class="btn btn-outline-primary">
                            <i class="bi bi-person-plus me-2"></i>立即注册
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
